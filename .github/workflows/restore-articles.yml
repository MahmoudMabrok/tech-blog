name: Restore Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore
        run: |
          git show 19d38498e967188292f12eba48523db8071f11dc:_data/articles.json > /tmp/old.json
          echo '[]' > /tmp/new.json
          jq --slurpfile n /tmp/new.json '[$n[0]] + .' /tmp/old.json > _data/articles.json || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/articles.json
          git commit -m "Restore articles" || echo "No changes"
          git push
