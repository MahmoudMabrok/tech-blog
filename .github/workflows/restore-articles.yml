name: Restore Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and prepend
        run: |
          git show 19d38498e967188292f12eba48523db8071f11dc:_data/articles.json > /tmp/old.json
          jq --slurpfile new new-article.json '[$new[0]] + .' /tmp/old.json > _data/articles.json
          jq empty _data/articles.json
          echo "Count: $(jq length _data/articles.json)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/articles.json
          git commit -m "Restore 40 articles + new Android Security article with explainers" || echo "No changes"
          git push
